name: refresh langs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    # deliberately no `push` trigger — this job commits, and a push
    # trigger would re-run it on its own commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_langs.py

      - name: commit if changed
        run: |
          FILES="assets/langs.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "stats: refresh"
          git push
